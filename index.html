<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <script>
        const theme = localStorage.getItem("theme");

        if (
            theme === "dark" ||
            (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
            document.documentElement.classList.add("dark");
        }
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda Corporativa Digital</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1 data-i18n="title">
        Agenda Corporativa
    </h1>

    <div class="top-controls">

        <select id="langSwitch" class="lang-minimal">
            <option value="pt">PT</option>
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="fr">FR</option>
            <option value="de">DE</option>
            <option value="it">IT</option>
        </select>

        <div class="theme-control">

            <span id="themeIcon">🌙</span>

            <label class="switch">
                <input type="checkbox" id="themeToggle">
                <span></span>
            </label>

            <button
                id="logoutBtn"
                class="logout-btn"
                onclick="logout()"
                data-i18n="logout"
            >
                Sair
            </button>

        </div>
    </div>
</header>

<!-- LOGIN -->
<section id="loginSection" class="login-wrapper">

    <div class="card login-card">

        <h2 data-i18n="login">
            Login
        </h2>

        <form id="loginForm">

            <input
                id="loginUsername"
                data-i18n="loginPlaceholder"
                placeholder="Nome"
                required
            >

            <input
                id="loginPassword"
                type="password"
                data-i18n="password"
                placeholder="Senha"
                required
            >

            <button data-i18n="enter">
                Entrar
            </button>

        </form>
    </div>
</section>

<!-- DASHBOARD -->
<section id="dashboard" style="display:none;">

    <div class="tabs">

        <button
            onclick="mostrarAba('contatos')"
            id="btnContatos"
            data-i18n="contacts"
        >
            Contatos
        </button>

        <button
            onclick="mostrarAba('usuarios')"
            id="btnUsuarios"
            data-i18n="users"
        >
            Usuários
        </button>

    </div>

    <!-- CONTATOS -->
    <div id="abaContatos" class="card">

        <h2 data-i18n="contacts">
            Contatos
        </h2>

        <form id="formCadastro" class="form-grid">

            <input
                id="ramal"
                data-i18n="extension"
                placeholder="Ramal"
                required
            >

            <input
                id="departamento"
                data-i18n="department"
                placeholder="Departamento"
                required
            >

            <input
                id="nome"
                data-i18n="responsible"
                placeholder="Nome"
                required
            >

            <button data-i18n="save">
                Salvar
            </button>

        </form>

        <div class="filter-wrapper">

            <label
                for="buscar"
                data-i18n="filter"
            >
                Filtrar
            </label>

            <div class="filter-controls">

                <select
                    id="tipoFiltro"
                    onchange="filtrarContatos()"
                >
                    <option value="nome" data-i18n="responsible">Contato</option>
                    <option value="departamento" data-i18n="department">Departamento</option>
                    <option value="ramal" data-i18n="extension">Ramal</option>
                </select>

                <input
                    id="buscar"
                    data-i18n="search"
                    placeholder="Buscar..."
                    oninput="filtrarContatos()"
                >

            </div>
        </div>

        <div class="table-container">

            <table aria-label="Tabela de contatos">

                <thead>
                    <tr>
                        <th scope="col" data-i18n="extension">Ramal</th>
                        <th scope="col" data-i18n="department">Departamento</th>
                        <th scope="col" data-i18n="responsible">Responsável</th>
                        <th scope="col" id="colAcoes" data-i18n="actions">Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaContatos"></tbody>

            </table>
        </div>
    </div>

    <!-- USUÁRIOS -->
    <div id="abaUsuarios" class="card" style="display:none;">

        <h2 data-i18n="users">
            Usuários
        </h2>

        <form id="formUsuarios" class="form-grid" novalidate>

            <label for="userNome" class="sr-only">Nome</label>
            
                <input
                    id="userNome"
                    name="nome"
                    data-i18n="name"
                    placeholder="Nome"
                    required
                    aria-required="true"
                >

            <label for="userUsername" class="sr-only">Usuário</label>

                <input
                    id="userUsername"
                    name="username"
                    data-i18n="nameUser"
                    placeholder="Usuário"
                    required
                    aria-required="true"
                >

            <label for="userEmail" class="sr-only">Email</label>
                
                <input
                    id="userEmail"
                    name="email"
                    type="email"
                    data-i18n="email"
                    placeholder="Email"
                    required
                    aria-required="true"
            >

            <label for="userSenha" class="sr-only">Senha</label>
                
                <input
                    id="userSenha"
                    name="senha"
                    type="password"
                    data-i18n="password"
                    placeholder="Senha"
                    required
                    minlength="6"
                    aria-required="true"
                >

            <label for="userTipo" class="sr-only">Tipo</label>
            <select id="userTipo" aria-label="Tipo de usuário">
                <option value="padrao" data-i18n="standard"> 
                    Padrão 
                </option> 
                
                <option value="gestor" data-i18n="manager"> 
                    Gestor 
                </option> 
                
                <option value="admin" data-i18n="admin"> 
                    Admin 
                </option> </select>

            <button
                type="submit"
                onclick="criarUsuario()"
                data-i18n="create"
            >
                Criar
            </button>

        </form>

        <div class="filter-wrapper">

            <label
                for="buscarUsuarios"
                data-i18n="filter"
            >
                Filtrar
            </label>

            <div class="filter-controls">

                <select
                    id="tipoFiltroUsuarios"
                    onchange="filtrarUsuarios()"
                >
                    <option value="nome" data-i18n="name">
                        Nome
                    </option>

                    <option value="username" data-i18n="nameUser">
                        Username
                    </option>

                    <option value="email" data-i18n="email">
                        Email
                    </option>
                </select>

                <input
                    id="buscarUsuarios"
                    data-i18n="searchUsers"
                    placeholder="Buscar usuário..."
                    oninput="filtrarUsuarios()"
                >

            </div>
        </div>

        <div class="table-container">

            <table aria-label="Tabela de usuários">

                <thead>
                    <tr>
                        <th scope="col" data-i18n="name">Nome</th>
                        <th scope="col" data-i18n="nameUser">Usuário</th>
                        <th scope="col" data-i18n="email">Email</th>
                        <th scope="col" data-i18n="type">Tipo</th>
                        <th scope="col" data-i18n="password">Senha</th>
                        <th scope="col" data-i18n="actions">Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaUsuarios"></tbody>

            </table>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        <p>2026 - Projeto Integrador I - Univesp</p>
    </div>
</footer>

<script src="app.js"></script>

</body>
</html>
